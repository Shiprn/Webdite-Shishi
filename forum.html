<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/2a5ca774ab.js" crossorigin="anonymous"></script>
    <title>Forum</title>
</head>
<body>
    <h1 class="bubbles forum ">Just add your information if you accsessd website</h1>
      <br>
    <h2 class="bubbles foot">Definently wont be stolen</h2>
      <br>
    <form id="profile-form">
   <div class="now">
     <label class="label" for="fname"><b>First name:</b></label>
     <input class="what" type="text" id="fname" name="fname" placeholder="Spongebob" required>
   </div>
   <br>
   <div class="now" >
     <label class="label" for="lname"><b>Last name:</b></label>
     <input class="what" type="text" id="lname" name="lname" placeholder="Squarepants" required>
   </div>
   <br>
   <div class="now">
     <label class="label" for="uemail"><b>Email:</b></label>
     <input class="what" type="email" id="uemail" name="uemail" placeholder="Spongpants@gmail.com">
   </div>
   <br>
   <div class="now">
     <label class="label short" for="tel"><b>Phone Number:</b></label>
     <input class="what" type="tel" id="tel" name="tel" placeholder="+27 123 456 789" required>
   </div>
   <br>
   <div class="now">
     <label class="label" for="dob"><b>Date of Birth:</b></label>
     <input class="what" type="date" id="dob" name="dob" required>
   </div>
   <br>
   <div class="now">
        <label class="label shorter"><b>Title:</b></label>
     <label for="Mr."><b>Mr:</b></label>
     <input type="radio" id="Mr." name="title" value="Mr." required>
     <label for="Mrs."><b>Mrs:</b></label>
     <input type="radio" id="Mrs." name="title" value="Mrs." required>
     <label for="Other."><b>Other:</b></label>
     <input type="radio" id="Other." name="title" value="Other." required>
   </div>
     <br>
   <div >
     <input class="butt" id="mysubmit" type="submit" value="Submit">
   </div>
     <br>
    <div >
     <input class="butt" type="reset">
    </div>
    <br>
  </form>
  <br>
    <div >
      <a class="butt end-link" href="thanks.html">End</a>
    </div>
  <br>
 <a class="home-link" href="index.html">
  <i class="fa-solid fa-house home"></i>
 </a>

 <script src="js/forum.js" defer></script>

</body>
</html>
